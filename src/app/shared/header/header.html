<div class="topbar">
  @if (datosOng()) {
    <a [href]="'mailto:' + datosOng().contacto.email" class="topbar-contact">
      <i class="fas fa-envelope"></i>
      {{ datosOng().contacto.email }}
    </a>
    <div class="topbar-social">
      <a [href]="datosOng().redes.facebook" aria-label="Facebook" target="_blank">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a [href]="datosOng().redes.instagram" aria-label="Instagram" target="_blank">
        <i class="fab fa-instagram"></i>
      </a>
      <a [href]="datosOng().redes.tiktok" aria-label="TikTok" target="_blank">
        <i class="fab fa-tiktok"></i>
      </a>
      <a
        [href]="'https://wa.me/' + datosOng().contacto.telefono"
        class="topbar-contact"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-whatsapp"></i>
        {{ datosOng().contacto.telefonoDisplay }}
      </a>
    </div>
  }
</div>

<header>
  <img
    routerLink="/"
    src="logo/Logo Neuro Balance RRSS - Sin Fondo 3x.png"
    alt="Logo ONG"
    style="cursor: pointer"
  />
  <button class="menu-toggle" [class.active]="menuAbierto" (click)="toggleMenu()">
    <i class="fas fa-bars"></i>
  </button>

  <nav [class.show]="menuAbierto">
    <ul>
      <li><a routerLink="/">Inicio</a></li>
      <li><a routerLink="/actividades">Actividades</a></li>
      <li><a routerLink="/objetivos">Objetivos</a></li>

      <li class="dropdown">
        <span (click)="toggleSubMenu($event)">Nosotros ▾</span>
        <ul class="submenu" [class.show]="subMenuAbierto">
          <li><a routerLink="/nosotros" fragment="mision" (click)="cerrarMenus()">Misión</a></li>
          <li><a routerLink="/nosotros" fragment="vision" (click)="cerrarMenus()">Visión</a></li>
          <li>
            <a routerLink="/nosotros" fragment="profesionales" (click)="cerrarMenus()"
              >Profesionales</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </nav>
</header>
