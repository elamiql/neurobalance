<div class="topbar">
  @if (datosOng(); as datos) {
    <a [href]="'mailto:' + datos.contacto.email" class="topbar-contact">
      <i class="fas fa-envelope"></i>
      {{ datos.contacto.email }}
    </a>
    <div class="topbar-social">
      <a
        [href]="datos.redes.facebook"
        aria-label="Facebook"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-facebook-f"></i>
      </a>
      <a
        [href]="datos.redes.instagram"
        aria-label="Instagram"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fab fa-instagram"></i>
      </a>
      <a [href]="datos.redes.tiktok" aria-label="TikTok" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-tiktok"></i>
      </a>

      <a
        [href]="'https://wa.me/' + datos.contacto.telefono"
        class="topbar-contact"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp"
      >
        <i class="fab fa-whatsapp"></i>
        {{ datos.contacto.telefonoDisplay }}
      </a>
    </div>
  }
</div>

<header>
  <img
    routerLink="/"
    src="logo/Logo Neuro Balance RRSS - Sin Fondo 3x.png"
    alt="Logo ONG"
    style="cursor: pointer"
  />

  <button class="menu-toggle" [class.active]="menuAbierto" (click)="toggleMenu()">
    <i class="fas fa-bars icon-bars"></i>
    <i class="fas fa-times icon-close"></i>
  </button>

  <nav [class.show]="menuAbierto">
    <ul>
      <li><a routerLink="/">Inicio</a></li>
      <li><a routerLink="/actividades">Actividades</a></li>
      <li><a routerLink="/objetivos">Objetivos</a></li>

      <li class="dropdown">
        <span (click)="toggleSubMenu($event)">Nosotros <span class="flecha-dropdown">▾</span></span>
        <ul class="submenu" [class.show]="subMenuAbierto">
          <li><a routerLink="/nosotros" fragment="mision">Misión</a></li>
          <li><a routerLink="/nosotros" fragment="vision">Visión</a></li>
          <li><a routerLink="/nosotros" fragment="profesionales">Profesionales</a></li>
        </ul>
      </li>
    </ul>
  </nav>
</header>
